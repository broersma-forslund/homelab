dra-driver-nvidia-gpu:
  nvidiaDriverRoot: /usr/local
  # Chart refuses to install without this flag set to true
  # Will be removed once ExtendedResourceRequest is GA
  gpuResourcesEnabledOverride: true
  resources:
    computeDomains:
      enabled: false

  # admission validation
  webhook:
    enabled: true

  featureGates:
    TimeSlicingSettings: true

gpu-operator:

  nfd:
    enabled: false
  cdi:
    enabled: false
  hostPaths:
    driverInstallDir: /usr/local
  driver:
    enabled: false
  toolkit:
    enabled: false
  devicePlugin:
    enabled: false
  dcgm:
    enabled: false
  dcgmExporter:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
  gfd:
    enabled: false
  migManager:
    enabled: false
  vgpuDeviceManager:
    enabled: false
  vfioManager:
    enabled: false
  sandboxDevicePlugin:
    enabled: false
  kataSandboxDevicePlugin:
    enabled: false
  ccManager:
    enabled: false

