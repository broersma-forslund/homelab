dra-driver-nvidia-gpu:
  nvidiaDriverRoot: /usr/local
  # Chart refuses to install without this flag set to true
  # Will be removed once ExtendedResourceRequest is GA
  gpuResourcesEnabledOverride: true
  resources:
    computeDomains:
      enabled: false

  # admission validation
  webhook:
    enabled: true

  featureGates:
    TimeSlicingSettings: true

gpu-operator:
  daemonsets:
    tolerations:
      - key: node-role.kubernetes.io/gpu
        operator: Exists
  nfd:
    enabled: false
  driver:
    enabled: false
  toolkit:
    enabled: false
  devicePlugin:
    enabled: false
  dcgmExporter: 
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s

dcgm-exporter:
  runtimeClassName: nvidia
  kubernetesDRA:
    enabled: true
  serviceMonitor:
    enabled: true
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: feature.node.kubernetes.io/pci-10de.present
                operator: In
                values:
                  - "true"
          - matchExpressions:
              - key: feature.node.kubernetes.io/pci-0302_10de.present
                operator: In
                values:
                  - "true"
          - matchExpressions:
              - key: feature.node.kubernetes.io/pci-0300_10de.present
                operator: In
                values:
                  - "true"
          - matchExpressions:
              - key: feature.node.kubernetes.io/cpu-model.vendor_id
                operator: In
                values:
                  - NVIDIA
          - matchExpressions:
              - key: nvidia.com/gpu.present
                operator: In
                values:
                  - "true"
  tolerations:
    - key: node-role.kubernetes.io/gpu
      operator: Exists
  nfd:
    nodefeaturerules: true
