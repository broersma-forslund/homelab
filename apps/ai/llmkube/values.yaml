llmkube:
  crds:
    install: true
    keep: false

  priorityClasses:
    enabled: false

  webhook:
    certManager:
      enabled: true

  controllerManager:
    replicaCount: 2
    tolerations:
      - key: node-role.kubernetes.io/gpu
        operator: Exists

  modelCache:
    enabled: true
    size: 100Gi
    storageClass: local-nvme
    accessMode: ReadWriteOnce

  networkPolicies:
    # Gateway-mode ingress is restricted by this wrapper's templates/network policies.
    # Leave the upstream Proxy-mode policies disabled.
    enabled: false

  metrics:
    enabled: true

  prometheus:
    serviceMonitor:
      enabled: true
    inferencePodMonitor:
      enabled: true

  grafana:
    dashboards:
      enabled: true
      additionalLabels:
        grafana_dashboard: "1"
      annotations:
        com.grafana/dashboard-folder: LLM Kube
      only:
        - llamacpp-dashboard
        - llmkube-inference

models:
  prefetch: false

modelRouter:
  defaultRoute: gemma4
  backends:
    - name: gemma4
      inferenceServiceRef:
        name: llamacpp-gemma4-26b-a4b
    - name: openwebui-tasks
      inferenceServiceRef:
        name: llamacpp-qwen3-0.6b
embeddingRouter:
  backend:
    name: openwebui-embedding
    inferenceServiceRef:
      name: llamacpp-bge-m3

llamacpp:
  cuda:
    image:
      repository: ghcr.io/ggml-org/llama.cpp
      tag: server-cuda13@sha256:2047aa53a876065142e92e9f00365192e20ffab09c42932c932cabc9528ae603
  intel:
    image:
      repository: ghcr.io/ggml-org/llama.cpp
      tag: server-intel@sha256:a3a13d0956ba215b34e153919a3dfad4f9efc34ff20ec7535b0c436e1f88fb73

agentrouter:
  tls:
    issuer: svc-cluster-local-issuer
    secretName: agentrouter-tls
  oidc:
    # LLMKube's native JWT configuration validates issuer/signature/expiry, not audience.
    issuer: https://authentik.mobrockers.com/application/o/open-webui/
    jwksUri: https://authentik.mobrockers.com/application/o/open-webui/jwks/
  apiTokens:
    - name: homeassistant
    - name: rouke-copilot
      ownerEmail: "mobrockers@live.nl"
    - name: openwebui-rag
      gateways:
        - embeddings
  tokenJob:
    image: docker.io/alpine/kubectl:1.37.3
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  route:
    enabled: true
    hostnames:
      - inference.mobrockers.com
    parentRefs:
      - name: private
        namespace: envoy-gateway
        sectionName: web-https
    timeouts:
      request: 600s
      backendRequest: 600s
  grafana:
    dashboards:
      enabled: true
