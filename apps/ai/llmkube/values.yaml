llmkube:
  crds:
    install: true
    keep: false

  controllerManager:
    replicaCount: 1
    leaderElection:
      enabled: false
    tolerations:
      - key: node-role.kubernetes.io/gpu
        operator: Exists

  modelCache:
    enabled: true
    size: 100Gi
    storageClass: local-nvme
    accessMode: ReadWriteOnce

  networkPolicies:
    enabled: false

  metrics:
    enabled: true

  prometheus:
    serviceMonitor:
      enabled: true
    inferencePodMonitor:
      enabled: true

  grafana:
    dashboards:
      enabled: true
      additionalLabels:
        grafana_dashboard: "1"
      only:
        - llamacpp-dashboard
        - llmkube-inference

llamacpp:
  intel:
    image:
      repository: ghcr.io/ggml-org/llama.cpp
      tag: server-intel-b10450
