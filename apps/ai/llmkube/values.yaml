llmkube:
  crds:
    install: true
    keep: false

  webhook:
    certManager:
      enabled: true

  controllerManager:
    replicaCount: 2
    tolerations:
      - key: node-role.kubernetes.io/gpu
        operator: Exists

  modelCache:
    enabled: true
    size: 100Gi
    storageClass: local-nvme
    accessMode: ReadWriteOnce

  networkPolicies:
    enabled: false

  metrics:
    enabled: true

  prometheus:
    serviceMonitor:
      enabled: true
    inferencePodMonitor:
      enabled: true

  grafana:
    dashboards:
      enabled: true
      additionalLabels:
        grafana_dashboard: "1"
      only:
        - llamacpp-dashboard
        - llmkube-inference

models:
  prefetch: false
modelRouter:
  defaultRoute: gemma4
  backends:
    - name: gemma4
      inferenceServiceRef:
        name: llamacpp-gemma4-26b-a4b
    - name: openwebui-tasks
      inferenceServiceRef:
        name: llamacpp-qwen3-0.6b
embeddingRouter:
  backend:
    name: openwebui-embedding
    inferenceServiceRef:
      name: llamacpp-bge-m3
llamacpp:
  cuda:
    image:
      repository: ghcr.io/ggml-org/llama.cpp
      tag: server-cuda13@sha256:025d1b2744431ea5bedfc2c7c706af823136abf707fa0898f09b29cdc3baabf2
  intel:
    image:
      repository: ghcr.io/ggml-org/llama.cpp
      tag: server-intel@sha256:a3a13d0956ba215b34e153919a3dfad4f9efc34ff20ec7535b0c436e1f88fb73
