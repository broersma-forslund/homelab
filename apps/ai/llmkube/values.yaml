llmkube:
  crds:
    install: true
    keep: false

  controllerManager:
    replicaCount: 1
    leaderElection:
      enabled: false

  modelCache:
    enabled: true
    size: 100Gi
    storageClass: local-nvme
    accessMode: ReadWriteOnce

  networkPolicies:
    enabled: false

  metrics:
    enabled: true

  prometheus:
    serviceMonitor:
      enabled: true
    inferencePodMonitor:
      enabled: true

  grafana:
    dashboards:
      enabled: true

llamacpp:
  intel:
    image:
      repository: ghcr.io/ggml-org/llama.cpp
      tag: server-intel-b10450
