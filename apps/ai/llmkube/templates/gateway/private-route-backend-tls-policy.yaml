{{- if .Values.agentrouter.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: agentrouter-inference
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: agentrouter-agents
  validation:
    hostname: agentrouter-agents.{{ .Release.Namespace }}.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: svc-cluster-local-bundle
{{- end }}
