{{- range $listener := list (dict "gateway" "agentrouter" "name" "webui" "method" "oidc") (dict "gateway" "agentrouter-agents" "name" "agents" "method" "api_key") (dict "gateway" "agentrouter-embeddings" "name" "embeddings" "method" "api_key") }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: agentrouter-{{ $listener.name }}
spec:
  headers:
    earlyRequestHeaders:
      remove:
        - x-agentrouter-user-email
        {{- if ne $listener.method "oidc" }}
        - x-agentrouter-credential-id
        {{- end }}
      set:
        - name: x-agentrouter-auth-method
          value: {{ $listener.method }}
        {{- if eq $listener.method "oidc" }}
        - name: x-agentrouter-credential-id
          value: open-webui
        {{- end }}
    lateResponseHeaders:
      set:
        - name: x-content-type-options
          value: nosniff
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $listener.gateway }}
      sectionName: {{ $listener.name }}
  connection:
    bufferLimit: 50Mi
  {{- if eq $listener.name "agents" }}
  # NetworkPolicy restricts this listener to the private ingress proxy.
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  {{- end }}
  http2:
    initialStreamWindowSize: 16Mi
    initialConnectionWindowSize: 24Mi
  tls:
    minVersion: "1.2"
{{- end }}
