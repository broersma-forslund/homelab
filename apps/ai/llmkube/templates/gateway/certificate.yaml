apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: agentrouter-tls
spec:
  secretName: {{ .Values.agentrouter.tls.secretName }}
  dnsNames:
    - agentrouter.{{ .Release.Namespace }}.svc.cluster.local
    - agentrouter-agents.{{ .Release.Namespace }}.svc.cluster.local
    - agentrouter-embeddings.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ .Values.agentrouter.tls.issuer }}
    kind: ClusterIssuer
