{{- if .Values.agentrouter.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentrouter-inference
spec:
  hostnames: {{ .Values.agentrouter.route.hostnames | toYaml | nindent 4 }}
  parentRefs: {{ .Values.agentrouter.route.parentRefs | toYaml | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      timeouts: {{ .Values.agentrouter.route.timeouts | toYaml | nindent 8 }}
      backendRefs:
        - name: agentrouter-agents
          port: 8443
{{- end }}
