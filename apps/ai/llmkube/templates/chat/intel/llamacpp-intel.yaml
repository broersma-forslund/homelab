apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: intel-chat
spec:
  modelRef: qwen2-1-5b
  runtime: llamacpp
  image: {{ .Values.llamacpp.intel.image.repository }}:{{ .Values.llamacpp.intel.image.tag }}
  mode: chat
  contextSize: 4096
  jinja: true
  parallelSlots: 2
  tolerations:
    - key: node-role.kubernetes.io/gpu
      operator: Exists
  extraArgs:
    - "--alias"
    - "qwen2-1-5b"
    - "--kv-unified"