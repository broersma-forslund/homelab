apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: cpu-task
spec:
  nodeSelector:
    kubernetes.io/hostname: njord-gpu1
  tolerations:
    - key: node-role.kubernetes.io/gpu
      operator: Exists
  modelRef: qwen3-0.6b
  runtime: llamacpp
  mode: chat
  parallelSlots: 1
  extraArgs:
    - "--alias"
    - "qwen3-0.6b"