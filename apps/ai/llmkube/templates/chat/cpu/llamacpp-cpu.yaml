apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: cpu-task
spec:
  modelRef: qwen3-0.6b
  runtime: llamacpp
  mode: chat
  contextSize: 4096
  parallelSlots: 1
  nodeSelector:
    kubernetes.io/hostname: njord-gpu1
  tolerations:
    - key: node-role.kubernetes.io/gpu
      operator: Exists
