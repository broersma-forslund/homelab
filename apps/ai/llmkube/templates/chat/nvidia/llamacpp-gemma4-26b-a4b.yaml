apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llamacpp-gemma4-26b-a4b
spec:
  image: {{ .Values.llamacpp.cuda.image.repository }}:{{ .Values.llamacpp.cuda.image.tag }}
  modelRef: gemma4-26b-a4b
  runtime: llamacpp
  mode: chat
  contextSize: 65536
  jinja: true
  parallelSlots: 1
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  flashAttention: false
  moeCPULayers: 19
  speculativeDecoding:
    type: draft-mtp
    draftModel: mtp-gemma-4-26B-A4B-it.gguf
    nDraftMax: 4
  resources:
    hostMemory: 48Gi
  tolerations:
    - key: node-role.kubernetes.io/gpu
      operator: Exists
  extraArgs:
    - --kv-unified
    - --chat-template-kwargs
    - '{"enable_thinking":true}'
