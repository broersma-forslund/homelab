apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llamacpp-gemma4-26b-a4b
spec:
  image: ghcr.io/ggml-org/llama.cpp:server-cuda13-b10450
  modelRef: gemma4-26b-a4b
  runtime: llamacpp
  mode: chat
  contextSize: 8192
  jinja: true
  parallelSlots: 1
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  flashAttention: true
  moeCPUOffload: true
  resources:
    hostMemory: 48Gi
  tolerations:
    - key: node-role.kubernetes.io/gpu
      operator: Exists
  extraArgs:
    - "--kv-unified"
    - "--chat-template-kwargs"
    - '{"enable_thinking":true}'
