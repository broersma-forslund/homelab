apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: nvidia-chat
spec:
  modelRef: qwen3.5-9b
  runtime: llamacpp
  mode: chat
  contextSize: 16384
  jinja: true
  parallelSlots: 2
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  flashAttention: true
  speculativeDecoding:
    type: disabled # mtp
  tolerations:
    - key: node-role.kubernetes.io/gpu
      operator: Exists
