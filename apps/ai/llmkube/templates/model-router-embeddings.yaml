apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelRouter
metadata:
  name: model-embeddings
spec:
  dataPlane: Gateway
  gatewayRef:
    name: agentrouter-embeddings
    namespace: agentrouter
  backends:
    - {{ .Values.embeddingRouter.backend | toYaml | nindent 6 | trim }}
  rules:
    - name: embeddings
      match:
        models:
          - {{ .Values.embeddingRouter.backend.name | quote }}
      route:
        backends:
          - {{ .Values.embeddingRouter.backend.name | quote }}
      timeout: 600s
