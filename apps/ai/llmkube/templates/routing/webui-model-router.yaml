apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelRouter
metadata:
  name: model-gateway
spec:
  dataPlane: Gateway
  gatewayRef:
    name: agentrouter
  policy:
    auth:
      jwt:
        provider: authentik
        issuer: {{ .Values.agentrouter.oidc.issuer | quote }}
        jwksURI: {{ .Values.agentrouter.oidc.jwksUri | quote }}
        teamClaim: email
        headerKey: x-agentrouter-user-email
  backends: {{ .Values.modelRouter.backends | toYaml | nindent 4 }}
  rules:
    {{- range .Values.modelRouter.backends }}
    - name: {{ .name }}
      match:
        models:
          - {{ .name | quote }}
      route:
        backends:
          - {{ .name | quote }}
      timeout: 600s
    {{- end }}
    - name: default
      route:
        backends:
          - {{ .Values.modelRouter.defaultRoute | quote }}
      timeout: 600s
