apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: ollama
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-ai-gateway
      name: ai-gateway
  hostnames:
    - "embed.envoy-ai-gateway"
    - "embed.envoy-ai-gateway.svc"
    - "embed.envoy-ai-gateway.svc.cluster"
    - "embed.envoy-ai-gateway.svc.cluster.local"
  rules:
    - matches:
        - headers:
            - name: x-ai-eg-model
              value: embedding-default
      backendRefs:
        - name: ollama
          modelNameOverride: bge-m3
