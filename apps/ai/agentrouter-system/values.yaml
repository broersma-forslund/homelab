gateway-helm:
  crds:
    enabled: false
  deployment:
    replicas: 2
    envoyGateway:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
  config:
    envoyGateway:
      gateway:
        controllerName: gateway.envoyproxy.io/agentrouter-controller
      provider:
        type: Kubernetes
        kubernetes:
          deploy:
            type: GatewayNamespace
          watch:
            type: Namespaces
            namespaces:
              - agentrouter-system
              - llmkube
      extensionApis:
        enableBackend: true
        enableEnvoyPatchPolicy: true
      extensionManager:
        hooks:
          xdsTranslator:
            translation:
              listener:
                includeAll: true
              route:
                includeAll: true
              cluster:
                includeAll: true
              secret:
                includeAll: true
            post:
              - Translation
              - Cluster
              - Route
        service:
          fqdn:
            hostname: agentrouter-controller.agentrouter-system.svc.cluster.local
            port: 1063

ai-gateway-helm:
  envoyGateway:
    namespace: agentrouter-system
  controller:
    fullnameOverride: agentrouter-controller
    requestHeaderAttributes: "x-agentrouter-user-email:user.email,x-agentrouter-credential-id:credential.id,x-agentrouter-auth-method:auth.method"
    quotaRateLimitServiceAddr: agentrouter-ratelimit.agentrouter-system
    watch:
      namespaces:
        - agentrouter-system
        - llmkube
    mutatingWebhook:
      certManager:
        enable: true
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: llmkube
    mcp:
      sessionEncryption:
        existingSecret: agentrouter-mcp-session-encryption
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

initSecretJob:
  enabled: true
  image:
    registry: docker.io
    repository: alpine/kubectl
    tag: 1.37.3
    pullPolicy: IfNotPresent
  resources: {}
