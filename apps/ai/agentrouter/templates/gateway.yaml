apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentrouter
spec:
  gatewayClassName: agentrouter
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: agentrouter
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - {{ .Release.Namespace }}
                  - llmkube
