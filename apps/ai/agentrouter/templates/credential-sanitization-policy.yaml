apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: agentrouter-strip-credentials
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentrouter
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentrouter-embeddings
  lua:
    - type: Inline
      inline: |
        function envoy_on_request(handle)
          handle:headers():remove("authorization")
          handle:headers():remove("x-api-key")
        end
