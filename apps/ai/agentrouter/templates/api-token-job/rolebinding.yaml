{{- if .Values.apiTokens }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentrouter-api-tokens
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentrouter-api-tokens
subjects:
  - kind: ServiceAccount
    name: agentrouter-api-tokens
    namespace: {{ .Release.Namespace }}
{{- end }}
