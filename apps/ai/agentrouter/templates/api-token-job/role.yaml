{{- if .Values.apiTokens }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentrouter-api-tokens
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range .Values.apiTokens }}
      - agentrouter-token-{{ .name }}
      {{- end }}
    verbs: ["get", "patch"]
{{- end }}
