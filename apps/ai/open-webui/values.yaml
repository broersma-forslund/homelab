open-webui:
  replicaCount: 2

  persistence:
    enabled: true
    size: 50Gi
    storageClass: ceph-filesystem
    accessModes:
      - ReadWriteMany

  websocket:
    enabled: true
    manager: redis

  # Apache Tika for improved document/content extraction (RAG uploads).
  tika:
    enabled: true

  openaiBaseApiUrls:
    - https://agentrouter.llmkube.svc.cluster.local/v1
  openaiApiKeys:
    - ""
  openaiApiConfigs:
    "0":
      auth_type: system_oauth
      prefix_id: agentrouter
      model_ids:
        - gemma4
        - openwebui-tasks
  searxngQueryUrl: http://searxng.searxng.svc.cluster.local:8080/search?q=<query>

  extraEnvVars:
    - name: AIOHTTP_CLIENT_SESSION_SSL
      value: /etc/ssl/agentrouter/ca.crt
    - name: SSL_CERT_FILE
      value: /etc/ssl/agentrouter/ca.crt
    - name: REQUESTS_CA_BUNDLE
      value: /etc/ssl/agentrouter/ca.crt
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: open-webui-db-app
          key: uri
    - name: WEBUI_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: open-webui-secret
          key: WEBUI_SECRET_KEY
    - name: RAG_OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: open-webui-agentrouter-rag
          key: apiKey

  volumes:
    - name: internal-ca
      configMap:
        name: svc-cluster-local-bundle
  volumeMounts:
    container:
      - name: internal-ca
        mountPath: /etc/ssl/agentrouter
        readOnly: true

  extraEnvFrom:
    - configMapRef:
        name: open-webui-env

  sso:
    enabled: true
    enableSignup: true
    enableRoleManagement: true
    roleManagement:
      rolesClaim: groups
      adminRoles: Administrators
      allowedRoles: Administrators,Users
    oidc:
      enabled: true
      providerName: Authentik
      providerUrl: https://authentik.mobrockers.com/application/o/open-webui/.well-known/openid-configuration
      scopes: "openid profile email groups offline_access"
      clientId: 2aL6rLRDHx1pN8epxCSVbG2CPvCunBRRxSSpetvz
      clientExistingSecret: open-webui-oidc-credentials
      clientExistingSecretKey: clientSecret

  route:
    enabled: true
    hostnames:
      - chat.mobrockers.com
    parentRefs:
      - name: private
        namespace: envoy-gateway
        sectionName: web-https
    timeouts:
      request: 600s
        

  # Disable built-in Ollama, Open WebUI pipelines, and terminals.
  ollama:
    enabled: false
  pipelines:
    enabled: false
  terminals:
    enabled: false

rag:
  baseUrl: https://agentrouter-embeddings.llmkube.svc.cluster.local/v1
  # Operator seals the generated openwebui-rag token for this Secret's apiKey.
  encryptedApiKey: ""

database:
  image:
    registry: ghcr.io
    repository: tensorchord/cloudnative-vectorchord
    tag: "18.4-1.1.1"
  backups:
    enabled: true
    destination: https://meijhorstbackups.blob.core.windows.net/cnpg
    retention: 8d
    schedule: '0 0 0 * * *'
    secretName: azure-blob-credentials
    azure:
      connectionStringKeyName: CONNECTION_STRING

# Init Secret Job Configuration
# Generates WEBUI_SECRET_KEY on cluster startup if not present
# Required for multi-replica deployments to share session tokens
initSecretJob:
  enabled: true
  image:
    registry: docker.io
    repository: alpine/kubectl
    tag: 1.37.2
    pullPolicy: IfNotPresent
  resources: {}
