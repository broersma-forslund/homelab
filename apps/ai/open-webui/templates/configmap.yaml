{{- $webui := index .Values "open-webui" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-env
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: env
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
data:
  ENABLE_PERSISTENT_CONFIG: "false"
  ENABLE_DIRECT_CONNECTIONS: "false"

  # --- General ---
  # Derived from route.hostnames so it can't drift from the actual HTTPRoute address.
  WEBUI_URL: "https://{{ index $webui.route.hostnames 0 }}"

  ENABLE_API_KEYS : "true"
  USER_PERMISSIONS_FEATURES_API_KEYS: "true"

  # --- Tasks ---
  ENABLE_CONTEXT_COMPACTION: "true"
  TASK_MODEL_EXTERNAL: "qwen3-0.6b"

  # --- Memories ---
  ENABLE_MEMORY_BACKGROUND_REVIEW: "true"

  # --- Vector DB: pgvector via the VectorChord Postgres image ---
  # Extension is created declaratively by CNPG's Database CR (see
  # templates/database/database.yaml), so the app DB role can stay non-superuser.
  VECTOR_DB: pgvector
  PGVECTOR_CREATE_EXTENSION: "false"

  # --- Code execution:  ---
  ENABLE_CODE_EXECUTION: "false"
  ENABLE_CODE_INTERPRETER: "false"

  # --- RAG embeddings: use the LLMKube ModelRouter OpenAI-compatible endpoint ---
  ENABLE_RAG_LOCAL_WEB_FETCH: "true"
  RAG_SYSTEM_CONTEXT: "true"
  RAG_EMBEDDING_ENGINE: "openai"
  RAG_OPENAI_API_BASE_URL: "http://model-router-proxy.llmkube.svc.cluster.local:8080/v1"
  RAG_OPENAI_API_KEY: ""
  RAG_EMBEDDING_MODEL: "bge-m3"
  RAG_QUERY_PREFIX: ""
  RAG_CONTENT_PREFIX: ""
  RAG_EMBEDDING_BATCH_SIZE: "20"
  RAG_FILE_MAX_SIZE: "100"
  RAG_FILE_MAX_COUNT: "10"
  CHUNK_SIZE: "4000"
  CHUNK_OVERLAP: "600"
  CHUNK_MIN_SIZE_TARGET: "200"
  ENABLE_RAG_HYBRID_SEARCH: "true"
  ENABLE_RAG_HYBRID_SEARCH_ENRICHED_TEXTS: "true"
  RAG_RERANKING_ENGINE: "sentence_transformers"
  RAG_RERANKING_MODEL: "BAAI/bge-reranker-v2-m3"
  RAG_TOP_K: "25"
  RAG_RERANKING_MODEL_TOP_K: "5"
  ENABLE_WEB_SEARCH: "true"
  WEB_SEARCH_ENGINE: "searxng"
  SEARXNG_QUERY_URL: {{ $webui.searxngQueryUrl }}
  WEB_LOADER_ENGINE: "playwright"
  WEB_SEARCH_RESULT_COUNT: "5"
  WEB_LOADER_CONCURRENT_REQUESTS: "5"

  # --- Offline mode / model-download lockdown ---
  # Safe alongside the above: OFFLINE_MODE only blocks HuggingFace Hub downloads
  # (local sentence-transformers/whisper); OAuth, external LLM APIs, and web
  # search/RAG via external APIs remain functional.
  OFFLINE_MODE: "false"
  ENABLE_VERSION_UPDATE_CHECK: "false"
  HF_HUB_OFFLINE: "0"
  RAG_EMBEDDING_MODEL_AUTO_UPDATE: "true"
  RAG_RERANKING_MODEL_AUTO_UPDATE: "true"
  WHISPER_MODEL_AUTO_UPDATE: "true"

  # --- Hardening: auth/session (Authentik SSO is the only login path) ---
  ENABLE_LOGIN_FORM: "false"
  ENABLE_PASSWORD_AUTH: "false"
  ENABLE_PASSWORD_CHANGE_FORM: "false"
  WEBUI_SESSION_COOKIE_SECURE: "true"
  WEBUI_SESSION_COOKIE_SAME_SITE: strict
  ENABLE_OAUTH_BACKCHANNEL_LOGOUT: "true"

  # --- Hardening: network / fetch ---
  CORS_ALLOW_ORIGIN: "https://{{ index $webui.route.hostnames 0 }}"
  USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

  # --- Hardening: misc data/privacy ---
  ENABLE_PROFILE_IMAGE_URL_FORWARDING: "false"
  ENABLE_PIP_INSTALL_FRONTMATTER_REQUIREMENTS: "false"
  ANONYMIZED_TELEMETRY: "false"
  DO_NOT_TRACK: "true"
  SHOW_ADMIN_DETAILS: "false"
  ENABLE_COMMUNITY_SHARING: "false"

  # --- Scaling knobs (multi-replica + Redis already in place) ---
  DATABASE_POOL_SIZE: "15"
  DATABASE_POOL_MAX_OVERFLOW: "20"
  THREAD_POOL_SIZE: "2000"
  DATABASE_USER_ACTIVE_STATUS_UPDATE_INTERVAL: "300"
  ENABLE_QUERIES_CACHE: "true"
