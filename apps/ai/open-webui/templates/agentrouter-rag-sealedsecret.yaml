{{- if .Values.rag.encryptedApiKey }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: open-webui-agentrouter-rag
spec:
  encryptedData:
    # echo -n "<RAG-API-token>" | kubeseal --cert https://sealed-secrets.mobrockers.com/v1/cert.pem --raw --name="open-webui-agentrouter-rag" -n open-webui | clip.exe
    # Paste the result into rag.encryptedApiKey in values.yaml.
    apiKey: {{ .Values.rag.encryptedApiKey | quote }}
  template:
    metadata:
      name: open-webui-agentrouter-rag
    type: Opaque
{{- end }}
