apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: ai-gateway
spec:
  telemetry:
    accessLog:
      settings:
        - type: Route
          sinks:
            - type: File
              file:
                path: /dev/stdout
        - type: Listener
          sinks:
            - type: File
              file:
                path: /dev/stdout
        - type: Upstream
          sinks:
            - type: File
              file:
                path: /dev/stdout
  shutdown:
    drainTimeout: 240s
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              memory: 1Gi
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  volumes:
                    - name: tmp
                      emptyDir: {}
                  containers:
                    - name: envoy
                      volumeMounts:
                        - name: tmp
                          mountPath: /tmp
                    - name: shutdown-manager
                      volumeMounts:
                        - name: tmp
                          mountPath: /tmp
      envoyPDB:
        maxUnavailable: 1
      envoyService:
        type: ClusterIP
