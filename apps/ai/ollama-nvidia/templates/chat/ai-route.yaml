apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: ollama-chat
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-ai-gateway
      name: ai-gateway
  hostnames:
    - chat.envoy-ai-gateway
    - chat.envoy-ai-gateway.svc
    - chat.envoy-ai-gateway.svc.cluster
    - chat.envoy-ai-gateway.svc.cluster.local
  rules:
    - matches:
        - headers:
            - name: x-ai-eg-model
              value: qwen3
      backendRefs:
        - name: ollama
          modelNameOverride: qwen3:14b
