dawarich:
  hostname: timeline.mobrockers.com
  config:
    oidc:
      enabled: true
      autoRegister: true
      providerName: Authentik
      issuerUrl: https://authentik.mobrockers.com/application/o/dawarich/
      clientId: ffCBiMvhKwUp7UlOagvZYZTuo7abXZArfNRp5FDe
      secretName: oidc-credentials
  database:
    backups:
      enabled: true
      destination: https://meijhorstbackups.blob.core.windows.net/cnpg/dawarich
      retention: 8d
      schedule: '0 0 0 * * *'
      secretName: azure-blob-credentials
      provider: azure
      azure:
        connectionStringKeyName: CONNECTION_STRING
  ingress:
    enabled: false
  route:
    enabled: true
    hostnames:
    - timeline.mobrockers.com
    parentRefs:
    - name: private
      namespace: envoy-gateway
      sectionName: web-https
    - name: public
      namespace: envoy-gateway
      sectionName: web-https

  photon:
    config:
      logLevel: DEBUG
      reverseOnly: true
      languages: [ 'en', 'nl', 'se' ]
    persistence:
      size: 100Gi


  redis:
    master:
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 1Gi
