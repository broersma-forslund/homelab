apiVersion: apps.emqx.io/v3beta1
kind: EMQX
metadata:
  name: emqx
spec:
  image: '{{ .Values.cluster.image.repository }}:{{ .Values.cluster.image.tag }}'
  revisionHistoryLimit: 0

  updateStrategy:
    evacuationStrategy:
      # Single core node: no evacuation target, it would only delay restarts.
      type: Disabled

  config:
    roots:
      listeners:
        tcp:
          default:
            enable: false
        ws:
          default:
            enable: false
        wss:
          default:
            enable: false
        ssl:
          default:
            enable: false
          internal:
            bind: '0.0.0.0:8884'
            ssl_options:
              cacertfile: /mounted/cert/mqtt-emqx-svc/ca.crt
              certfile: /mounted/cert/mqtt-emqx-svc/tls.crt
              keyfile: /mounted/cert/mqtt-emqx-svc/tls.key
          external:
            bind: '0.0.0.0:8883'
            ssl_options:
              certfile: /mounted/cert/mqtt-mobrockers-com/tls.crt
              keyfile: /mounted/cert/mqtt-mobrockers-com/tls.key

      authentication:
        - mechanism: password_based
          backend: built_in_database

      authorization:
        no_match: deny
        deny_action: disconnect
        sources:
          - type: built_in_database

      mqtt:
        ignore_loop_deliver: false
        retain_available: true
        wildcard_subscription: true
        use_username_as_clientid: true

      retainer:
        enable: true
        backend:
          type: built_in_database
          storage_type: disc

      dashboard:
        sso:
          oidc:
            enable: true
            backend: oidc
            issuer: https://authentik.mobrockers.com/application/o/emqx/
            clientid: FrQmQnbUFYlOX7ppghAODr2i0QWCGYZNlD5wSUFh
            # Authentik client secret from the mounted emqx-dashboard-oidc-secret
            secret: 'file:///mounted/oidc/client-secret'
            dashboard_addr: https://emqx.mobrockers.com
            ssl:
              enable: true
              verify: verify_peer

  coreTemplate:
    spec:
      persistentVolumeClaimSpec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 50Mi
      extraVolumes:
      - name: mqtt-mobrockers-com-tls
        secret:
          secretName: mqtt-mobrockers-com-tls
      - name: mqtt-emqx-svc-tls
        secret:
          secretName: mqtt-emqx-svc-tls
      - name: dashboard-oidc
        secret:
          secretName: emqx-dashboard-oidc-secret
      extraVolumeMounts:
      - name: mqtt-mobrockers-com-tls
        mountPath: /mounted/cert/mqtt-mobrockers-com
      - name: mqtt-emqx-svc-tls
        mountPath: /mounted/cert/mqtt-emqx-svc
      - name: dashboard-oidc
        mountPath: /mounted/oidc

  listenersServiceTemplate:
    metadata:
      annotations:
        'external-dns.kubernetes.io/hostname': mqtt.mobrockers.com
        'io.cilium/lb-ipam-ips': 10.0.102.230
    spec:
      type: LoadBalancer
      externalTrafficPolicy: Local
