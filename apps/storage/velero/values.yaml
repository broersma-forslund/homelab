velero:
  revisionHistoryLimit: 0
  resources: { }

  initContainers:
   - name: velero-plugin-for-microsoft-azure
     image: velero/velero-plugin-for-microsoft-azure:v1.14.2
     imagePullPolicy: IfNotPresent
     volumeMounts:
      - mountPath: /target
        name: plugins

  configuration:
    defaultSnapshotMoveData: true
    backupStorageLocation:
    - name: default
      provider: azure
      bucket: velero
      default: true
      credential:
        name: azure-credentials
        key: credentials
      config:
        useAAD: 'true'
        subscriptionId: e71a7bce-3743-48a9-a257-87b8d7180790
        resourceGroup: meijhorst
        storageAccount: meijhorstbackups

    volumeSnapshotLocation:
    - name: default
      provider: azure
      credential:
        name: azure-credentials
        key: credentials
      config:
        useAAD: 'true'
        subscriptionId: e71a7bce-3743-48a9-a257-87b8d7180790
        resourceGroup: meijhorst
        storageAccount: meijhorstbackups

    features: EnableCSI

  deployNodeAgent: true
  nodeAgent:
    disableHostPath: true # only needed for FS backups
    extraArgs:
    - --node-agent-configmap=velero-node-agent-config
  schedules:
    # ----------------------------
    # CRITICAL - data we cannot easily re-create
    # ----------------------------

    # Hourly short-term restore points (keep 72h = 3 days)
    critical-hourly:
      schedule: "46 * * * *"          # every hour at :46
      useOwnerReferencesInBackup: true
      template:
        ttl: "72h"
        includedResources:
          - persistentvolumeclaims
        labelSelector:
          matchLabels:
            velero.io/backup-class: critical

    # Daily long-term restore points (keep 720h = 30 days)
    critical-daily:
      schedule: "17 2 * * *"          # daily 02:17
      useOwnerReferencesInBackup: true
      template:
        ttl: "720h"
        includedResources:
          - persistentvolumeclaims
        labelSelector:
          matchLabels:
            velero.io/backup-class: critical

    # ----------------------------
    # NONCRITICAL - data we can re-create, but for which initial setup is tedious
    # ----------------------------

    # Hourly restore points (keep 24h = 1 day)
    noncritical-hourly:
      schedule: "31 * * * *"          # every hour at :31
      useOwnerReferencesInBackup: true
      template:
        ttl: "24h"
        includedResources:
          - persistentvolumeclaims
        labelSelector:
          matchLabels:
            velero.io/backup-class: noncritical

    # Daily restore points (keep 192h = 8 days)
    noncritical-daily:
      schedule: "53 1 * * *"          # daily 01:53
      useOwnerReferencesInBackup: true
      template:
        ttl: "192h"
        includedResources:
          - persistentvolumeclaims
        labelSelector:
          matchLabels:
            velero.io/backup-class: noncritical

  metrics:
    serviceMonitor:
      enabled: true
    nodeAgentPodMonitor:
      enabled: true
