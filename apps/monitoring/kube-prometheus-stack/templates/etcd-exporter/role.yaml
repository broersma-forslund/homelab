apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: etcd-certificate-bootstrap
  namespace: prometheus
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources:
      - secrets
    resourceNames:
      - etcd-client-cert
    verbs:
      - get
      - update
      - patch