apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-certificate-bootstrap-talos-secrets
  namespace: prometheus-etcd-exporter
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  roles:
    - os:admin