      ## Gateway API permissions ##

  prometheus-node-exporter:
    revisionHistoryLimit: 0
    namespaceOverride: 'prometheus-node-exporter'

  kubeEtcd:
    service:
      selector:
        component: kube-controller-manager
      port: 2383
      targetPort: 2383
    serviceMonitor:
      scheme: https
      tlsConfig:
        serverName: localhost
        insecureSkipVerify: false
        ca:
          secret:
            name: etcd-client-cert
            key: etcd-ca.crt
        cert:
          secret:
            name: etcd-client-cert
            key: etcd-client.crt
        keySecret:
          name: etcd-client-cert
          key: etcd-client.key
      relabelings:
        - sourceLabels: [__meta_kubernetes_endpoint_address_target_name]
          regex: ^(.*)$
          targetLabel: nodename
          replacement: $1
          action: replace
      metricRelabelings:
        - action: labeldrop
          regex: pod
  kubelet:
    serviceMonitor:
      # https://github.com/learnk8s/resource-review-mixin/blob/master/kube-prometheus-stack-values.yaml
      # kube-prometheus-stack drops container_cpu_cfs_throttled_seconds_total by
      # default. Keep that metric because the CPU throttled time panel needs it,
      # while retaining the chart's other default volume-reduction filters.
      cAdvisorMetricRelabelings:
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_cpu_(load_average_10s|system_seconds_total|user_seconds_total)'
      # Drop less useful container / always zero filesystem metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
      # Drop less useful container memory metrics. container_memory_swap is kept because the
      # k8s.rules.container_memory_swap recording rule and the "Memory Usage (Swap)" columns
      # of the Compute Resources dashboards are built on it.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_memory_mapped_file'
      # Drop less useful container process metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_(file_descriptors|tasks_state|threads_max)'
      # Drop container_memory_failures_total{scope="hierarchy"} metrics,
      # we only need the container scope.
      - sourceLabels: [__name__, scope]
        action: drop
        regex: 'container_memory_failures_total;hierarchy'
      # Drop container_network_... metrics that match various interfaces that
      # correspond to CNI and similar interfaces. This avoids capturing network
      # metrics for host network containers.
      - sourceLabels: [__name__, interface]
        action: drop
        regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
      # Drop container spec metrics that overlap with kube-state-metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_spec.*'
      # Drop cgroup metrics with no pod.
      - sourceLabels: [id, pod]
        action: drop
        regex: '.+;'
    # - sourceLabels: [__name__, image]
    #   separator: ;
    #   regex: container_([a-z_]+);
    #   replacement: $1
    #   action: drop
    # - sourceLabels: [__name__]
    #   separator: ;
    #   regex: container_(network_tcp_usage_total|network_udp_usage_total|tasks_state|cpu_load_average_10s)
    #   replacement: $1
    #   action: drop

  grafana:
    revisionHistoryLimit: 0
    replicas: 1
    defaultDashboardsTimezone: Europe/Amsterdam
    route:
      main:
        enabled: true
        hostnames:
        - grafana.mobrockers.com
        parentRefs:
        - name: private
          namespace: envoy-gateway
          sectionName: web-https
        - name: public
          namespace: envoy-gateway
          sectionName: web-https

    env:
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: true
    grafana.ini:
      security:
        allow_embedding: true
      auth.basic:
        enabled: false
      auth:
        signout_redirect_url: https://authentik.mobrockers.com/application/o/grafana/end-session/
        oauth_auto_login: true
      auth.generic_oauth:
        enabled: true
        name: Authentik
        scopes: "openid email profile"
        auth_url: "https://authentik.mobrockers.com/application/o/authorize/"
        token_url: "https://authentik.mobrockers.com/application/o/token/"
        api_url: "https://authentik.mobrockers.com/application/o/userinfo/"
        client_id: $__file{/etc/secrets/auth_generic_oauth/client_id}
        client_secret: $__file{/etc/secrets/auth_generic_oauth/client_secret}
        allow_assign_grafana_admin: true
        role_attribute_path: contains(groups[*], 'Administrators') && 'Admin' || contains(groups[*], 'Contributor') && 'Editor' || 'Viewer'
      server:
        domain: "https://grafana.mobrockers.com"
        root_url: "https://grafana.mobrockers.com"
    extraSecretMounts:
      - name: auth-generic-oauth-secret-mount
        secretName: grafana-authentik-oauth-credentials
        defaultMode: 0440
        mountPath: /etc/secrets/auth_generic_oauth
        readOnly: true
    sidecar:
      alerts:
        enabled: true
        searchNamespace: ALL
      dashboards:
        enabled: true
        searchNamespace: ALL
        annotations:
          com.grafana/dashboard-folder: "Kubernetes"
        folderAnnotation: com.grafana/dashboard-folder
        provider:
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        searchNamespace: ALL
      plugins:
        enabled: false
        searchNamespace: ALL
      notifiers:
        enabled: false
        searchNamespace: ALL

  kubeProxy:
    enabled: false # Cilium replacement
