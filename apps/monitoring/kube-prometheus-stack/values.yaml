prometheus-operator-crds:
  crds:
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true
kube-prometheus-stack:
  crds:
    enabled: false

  defaultRules:
    rules:
      kubeProxy: false

  cleanPrometheusOperatorObjectNames: true
  prometheusOperator:
    revisionHistoryLimit: 0
    admissionWebhooks:
      patch:
        ttlSecondsAfterFinished: 5

  prometheus:
    prometheusSpec:
      probeSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      replicas: 2
      retention: 365d
      resources:
        requests:
          cpu: 300m
          memory: 2400Mi

      storageSpec:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 110Gi

  kube-state-metrics:
    revisionHistoryLimit: 0
    metricLabelsAllowlist: 
    - nodes=[topology.kubernetes.io/zone]
    customResourceState:
      enabled: true
      config:
        kind: CustomResourceStateMetrics
        spec:
          resources:
          ## Gateway API resources ##
            - groupVersionKind:
                group: gateway.networking.k8s.io
                kind: "Gateway"
                version: "v1"
              metricNamePrefix: gatewayapi_gateway
              labelsFromPath:
                name:
                  - metadata
                  - name
                namespace:
                  - metadata
                  - namespace
              metrics:
                - name: "info"
                  help: "Gateway information"
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        gatewayclass_name: [ spec, gatewayClassName ]
                - name: "labels_info"
                  help: "Kubernetes labels converted to Prometheus labels."
                  each:
                    type: Info
                    info:
                      path: [ metadata ]
                      labelsFromPath:
                        "*": [ labels ]
                - name: "created"
                  help: "created timestamp"
                  each:
                    type: Gauge
                    gauge:
                      path: [ metadata, creationTimestamp ]
                - name: "deleted"
                  help: "deletion timestamp"
                  each:
                    type: Gauge
                    gauge:
                      path: [ metadata, deletionTimestamp ]
                      nilIsZero: true
                - name: "listener_info"
                  help: "Gateway listener information"
                  each:
                    type: Info
                    info:
                      path: [ spec, listeners ]
                      labelsFromPath:
                        listener_name: [ "name" ]
                        port: [ "port" ]
                        protocol: [ "protocol" ]
                        hostname: [ "hostname" ]
                        tls_mode: [ "tls","mode" ]
                        allowed_routes_namespaces_from: [ "allowedRoutes", "namespaces", "from" ]
                - name: "status"
                  help: "status condition"
                  each:
                    type: Gauge
                    gauge:
                      path: [ status, conditions ]
                      labelsFromPath:
                        type: [ "type" ]
                      valueFrom: [ "status" ]
                - name: "status_listener_attached_routes"
                  help: "Number of attached routes for a listener"
                  each:
                    type: Gauge
                    gauge:
                      path: [ status, listeners ]
                      labelsFromPath:
                        listener_name: [ "name" ]
                      valueFrom: [ "attachedRoutes" ]
                - name: "status_address_info"
                  help: "Gateway address types and values"
                  each:
                    type: Info
                    info:
                      path: [ status, addresses ]
                      labelsFromPath:
                        type: [ "type" ]
                        value: [ "value" ]
            - groupVersionKind:
                group: gateway.networking.k8s.io
                kind: "GatewayClass"
                version: "v1"
              metricNamePrefix: gatewayapi_gatewayclass
              labelsFromPath:
